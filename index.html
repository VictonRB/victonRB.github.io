<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado de Ortopedia e Traumatologia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#475569',
                        success: '#22c55e',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-200 min-h-screen flex flex-col">

    <header class="bg-white dark:bg-gray-800 shadow-md p-4 flex justify-between items-center sticky top-0 z-10">
        <h1 class="text-xl md:text-2xl font-bold text-primary dark:text-blue-400">OrtoQuiz Pró</h1>
        <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition" aria-label="Alternar Tema">
            <svg id="moonIcon" class="w-6 h-6 text-gray-800 hidden dark:block dark:text-yellow-300" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
            <svg id="sunIcon" class="w-6 h-6 text-yellow-500 dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 2.366a1 1 0 011.415 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zm-2.366 4.22a1 1 0 010 1.415l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-4.22-2.366a1 1 0 01-1.415 0l-.707-.707a1 1 0 011.414-1.414l.707.707a1 1 0 010 1.415zM2 10a1 1 0 011-1h1a1 1 0 110 2H3a1 1 0 01-1-1zm2.366-4.22a1 1 0 010-1.415l.707-.707a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414 0zM10 5a5 5 0 100 10 5 5 0 000-10z" clip-rule="evenodd"></path></svg>
        </button>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 md:p-8">
        <div class="bg-white dark:bg-gray-800 shadow-xl rounded-2xl p-6 md:p-8 w-full max-w-3xl fade-in" id="appContainer">
            
            <!-- Tela Inicial -->
            <div id="homeScreen" class="text-center">
                <h2 class="text-2xl md:text-3xl font-bold mb-4">Bem-vindo ao Simulado</h2>
                <p class="text-gray-600 dark:text-gray-400 mb-8">Treine seus conhecimentos em Ortopedia e Traumatologia.</p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <button onclick="startQuiz('full')" class="bg-primary hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition transform hover:-translate-y-1">
                        Simulado Completo (Embaralhado)
                    </button>
                    <button onclick="showCategories()" class="bg-secondary hover:bg-gray-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition transform hover:-translate-y-1">
                        Treinar por Área
                    </button>
                </div>
            </div>

            <!-- Tela de Categorias -->
            <div id="categoryScreen" class="hidden text-center">
                <h2 class="text-2xl font-bold mb-4">Escolha a Área</h2>
                <div id="categoryList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6 text-left">
                </div>
                <button onclick="showHome()" class="text-primary hover:underline font-medium">← Voltar</button>
            </div>

            <!-- Tela do Quiz -->
            <div id="quizScreen" class="hidden">
                <div class="flex justify-between items-center mb-4 text-sm font-semibold text-gray-500 dark:text-gray-400">
                    <span id="questionCounter">Questão 1</span>
                    <span id="currentCategory" class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 px-3 py-1 rounded-full text-xs text-center">Categoria</span>
                </div>
                <h3 id="questionText" class="text-lg md:text-xl font-medium mb-6 leading-relaxed">Texto da questão...</h3>
                
                <div id="optionsContainer" class="flex flex-col gap-3 mb-6"></div>

                <div id="feedbackContainer" class="hidden bg-gray-50 dark:bg-gray-700 p-4 rounded-xl border-l-4 mb-6 fade-in">
                    <p id="feedbackTitle" class="font-bold mb-2"></p>
                    <p id="feedbackText" class="text-sm md:text-base"></p>
                </div>

                <div class="flex justify-end gap-3">
                    <button id="btnConfirm" onclick="confirmAnswer()" class="bg-primary hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition opacity-50 cursor-not-allowed" disabled>Responder</button>
                    <button id="btnNext" onclick="nextQuestion()" class="bg-secondary hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-lg transition hidden">Próxima</button>
                </div>
            </div>

            <!-- Tela de Resultados -->
            <div id="resultScreen" class="hidden text-center">
                <h2 class="text-3xl font-bold mb-2">Simulado Concluído!</h2>
                <div class="text-6xl font-black text-primary mb-6" id="finalScore">0%</div>
                
                <div class="bg-gray-50 dark:bg-gray-700 rounded-xl p-4 mb-6 text-left">
                    <h3 class="text-lg font-bold mb-4 border-b pb-2 dark:border-gray-600">Desempenho por Área</h3>
                    <div id="performanceBreakdown" class="flex flex-col gap-3"></div>
                </div>

                <div id="weakPointsContainer" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-4 mb-6 text-left hidden">
                    <h3 class="text-red-600 dark:text-red-400 font-bold mb-2 flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        Pontos de Atenção (< 60%)
                    </h3>
                    <ul id="weakPointsList" class="list-disc pl-5 text-sm text-gray-700 dark:text-gray-300"></ul>
                </div>

                <button onclick="showHome()" class="bg-primary hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition">Voltar ao Início</button>
            </div>

        </div>
    </main>

    <script>
        const categorias = [
            "Fraturas de clavícula e escápula",
            "Luxações glenoumerais",
            "Fraturas de antebraço",
            "Fraturas e luxações dos ossos do carpo",
            "Fraturas de coluna vertebral",
            "Fraturas e luxação do quadril",
            "Fraturas do fêmur",
            "Lesões ligamentares e meniscais do joelho",
            "Fraturas do tornozelo e do pé",
            "Fraturas da rótula, platotibial e da diáfise da perna",
            "Luxações do joelho" // Nova categoria adicionada
        ];

        const bancoDeQuestoes = [
            // --- Categoria 1: Clavícula e Escápula ---
            {
                categoria: categorias[0],
                texto: "Um homem de 32 anos de idade dá entrada após sofrer queda de motocicleta. Apresenta deformidade com exposição óssea de 2 cm na região clavicular direita, parestesia no membro superior e perda de extensão do punho/dedos. A conduta imediata correta é:",
                opcoes: ["Imobilização simples e alta com antibiótico oral.", "Redução fechada sob anestesia local e tipóia em oito.", "Lavagem abundante, antibioticoterapia venosa e cirurgia de urgência.", "Apenas analgesia, devido ao comprometimento do plexo braquial."],
                correta: 2,
                comentario: "Fraturas expostas são emergências. Exigem limpeza mecânico-cirúrgica, antibioticoterapia IV, profilaxia antitetânica e estabilização óssea rápida."
            }, 
            {
                categoria: categorias[0],
                texto: "SOBRE FRATURA DE CLAVÍCULA, MARQUE A OPÇÃO INCORRETA:",
                opcoes: ["Primeiro osso do corpo a se ossificar (5ª semana fetal).", "80% das fraturas ocorrem no terço médio.", "É muito difícil de diagnosticar.", "Maioria dessas fraturas podem ser eficientemente tratadas de forma conservadora."],
                correta: 2,
                comentario: "A clavícula é um osso subcutâneo, pelo que o diagnóstico clínico é bastante fácil e evidente devido à deformidade, dor e crepitação óssea palpável."
            },
            {
                categoria: categorias[0],
                texto: "Sobre as fraturas da escápula, qual a localização anatômica mais comumente fraturada e qual o mecanismo habitual?",
                opcoes: ["O colo da escápula, por trauma direto de baixa energia.", "O corpo da escápula, devido a traumas contusos de alta energia.", "O acrômio, frequentemente por avulsão ligamentar isolada.", "A cavidade glenoide, acometida em luxações posteriores leves."],
                correta: 1,
                comentario: "A grande maioria das fraturas da escápula acomete o corpo e está associada a traumas de alta energia (ex: acidentes de moto), frequentemente com lesões associadas (costelas, pulmão)."
            },
            {
                categoria: categorias[0],
                texto: "Segundo a classificação de Allman para fraturas de clavícula, o grupo I corresponde às fraturas de qual região e qual é a sua incidência relativa?",
                opcoes: ["Terço distal, sendo as mais raras (menos de 5%).", "Terço médio, correspondendo a aproximadamente 80% dos casos.", "Terço proximal (medial), representando 50% dos casos.", "Qualquer região exposta, incidência em torno de 20%."],
                correta: 1,
                comentario: "Na classificação de Allman, Grupo I = Terço Médio (80% a 85%); Grupo II = Terço Distal/Lateral (10% a 15%); Grupo III = Terço Proximal/Medial (cerca de 5%)."
            },
            {
                categoria: categorias[0],
                texto: "Qual dos seguintes achados constitui indicação absoluta (não relativa) para o tratamento cirúrgico de uma fratura fechada de clavícula?",
                opcoes: ["Encurtamento do ombro de 1 cm.", "Presença de cominuição moderada.", "Lesão vascular associada comprovada (ex: artéria subclávia).", "Dor de forte intensidade nas primeiras 24 horas."],
                correta: 2,
                comentario: "Indicações absolutas: fratura exposta, lesão neurovascular progressiva ou confirmada, ombro flutuante e pele sob tensão extrema (risco de necrose)."
            },
            {
                categoria: categorias[0],
                texto: "Nas fraturas do terço distal da clavícula (Classificação de Neer), o tipo II caracteriza-se pela instabilidade devido a qual estrutura rompida?",
                opcoes: ["Ligamento acromioclavicular.", "Ligamentos coracoclaviculares (conoide e trapezoide).", "Ligamento esternoclavicular.", "Tendão do músculo subclávio."],
                correta: 1,
                comentario: "No Neer Tipo II, a fratura ocorre medial aos ligamentos coracoclaviculares, que se encontram rompidos ou inseridos no fragmento distal, resultando em desvio superior do fragmento proximal."
            },

            // --- Categoria 2: Luxações glenoumerais ---
            {
                categoria: categorias[1],
                texto: "A luxação gleno-umeral mais comum é a anterior. Qual é o mecanismo de trauma clássico que causa esta lesão?",
                opcoes: ["Membro superior em abdução e rotação externa.", "Queda com o braço em adução cruzada.", "Impacto direto sobre o acrômio de cima para baixo.", "Braço em flexão anterior, adução e rotação interna."],
                correta: 0,
                comentario: "A luxação anterior (que perfaz ~95% dos casos) ocorre comumente através de força indireta com o membro superior em abdução e rotação externa."
            },
            {
                categoria: categorias[1],
                texto: "Um paciente com crise convulsiva prévia chega ao pronto-socorro referindo dor no ombro e limitação da rotação externa. A radiografia AP mostra o 'sinal da lâmpada' ou 'sinal do sorvete'. Qual o diagnóstico?",
                opcoes: ["Luxação acromioclavicular.", "Luxação anterior do ombro.", "Luxação posterior do ombro.", "Fratura do colo cirúrgico do úmero."],
                correta: 2,
                comentario: "O histórico de choque elétrico ou convulsão, limitação da rotação externa e o aspecto arredondado da cabeça do úmero no RX AP ('lâmpada') são clássicos da luxação posterior."
            },
            {
                categoria: categorias[1],
                texto: "O que é a lesão de Bankart, frequentemente encontrada em pacientes com luxação anterior recidivante do ombro?",
                opcoes: ["Fratura com afundamento da porção póstero-lateral da cabeça umeral.", "Ruptura do tendão da cabeça longa do bíceps.", "Avulsão do complexo labrum-cápsula da borda anteroinferior da glenoide.", "Fratura isolada do tubérculo maior."],
                correta: 2,
                comentario: "A lesão de Bankart é a desinserção do lábio (labrum) glenoidal anteroinferior, essencial na gênese da instabilidade anterior crônica."
            },
            {
                categoria: categorias[1],
                texto: "Durante o exame físico de uma luxação anterior aguda do ombro, é essencial testar a sensibilidade na face lateral do ombro. Qual nervo está sendo avaliado?",
                opcoes: ["Nervo radial.", "Nervo axilar.", "Nervo musculocutâneo.", "Nervo mediano."],
                correta: 1,
                comentario: "O nervo axilar passa intimamente à articulação (quadrilátero de Velpeau) e é o nervo mais lesado nas luxações anteriores. A alteração sensitiva ocorre na pele da região deltoídea."
            },
            {
                categoria: categorias[1],
                texto: "Qual manobra de redução fechada para luxação anterior do ombro baseia-se em tração contínua e suave e não utiliza alavanca para evitar fraturas umerais?",
                opcoes: ["Manobra de Kocher.", "Manobra de Stimson (ou técnica do peso pendente).", "Técnica de Hippocrates (pé na axila).", "Manobra de Milch modificada sem tração."],
                correta: 1,
                comentario: "A técnica de Stimson usa o peso do próprio membro pendente na maca com um pequeno peso extra. Evita alavancas perigosas, reduzindo risco de danos."
            },
            {
        categoria: categorias[1],
        texto: "Sobre luxação gleno-umeral, marque a opção CORRETA:",
        opcoes: [
            "Mais comum (85%) é luxação posterior.",
            "Quando ocorre em doente com menos de 20 anos: mais de 90% de recidiva.",
            "O tratamento conservador é com 6 semanas de tipóia.",
            "Manguito rotador é um estabilizador estático."
            ],
        correta: 1,
        comentario: "Em jovens (menos de 20 anos), o alto grau de atividade e a falha de cicatrização dos ligamentos (lesão de Bankart) geram taxas de recidiva da luxação que superam os 90%."
             },
            {
        categoria: categorias[1],
        texto: "Luxação anterior do ombro é muito comum durante a prática desportiva, principalmente nas modalidades de contacto como o judo e o andebol. Esse tipo de lesão tem, como mecanismo traumático, movimentos bruscos associados:",
        opcoes: [
            "à adução e à rotação externa do ombro.",
            "à adução e à rotação interna do ombro.",
            "à abdução e à rotação interna do ombro.",
            "à abdução e à rotação externa do ombro."
        ],
        correta: 3,
        comentario: "O mecanismo clássico da luxação anterior é o membro posicionado em abdução e rotação externa forçada, que alavanca a cabeça do úmero para fora da glenoide anteriormente."
    },

            // --- Categoria 3: Fraturas de antebraço ---
            {
                categoria: categorias[2],
                texto: "A fratura de Monteggia caracteriza-se por:",
                opcoes: ["Fratura da diáfise da ulna com luxação da cabeça do rádio.", "Fratura da diáfise do rádio com luxação da articulação radioulnar distal.", "Fratura isolada do terço distal do rádio.", "Fratura de rádio e ulna com desvio volar e encurtamento."],
                correta: 0,
                comentario: "Monteggia: ulna fraturada (proximal) + rádio luxado (proximal). Mnemônico MUGR (Monteggia Ulna, Galeazzi Rádio)."
            },
            {
                categoria: categorias[2],
                texto: "Em adultos, o tratamento padrão-ouro para fraturas desviadas das diáfises do rádio e da ulna é:",
                opcoes: ["Redução incruenta e gesso axilopalmar por 8 semanas.", "Haste intramedular flexível em ambos os ossos.", "Redução aberta anatômica e fixação interna com placas de compressão.", "Imobilização apenas com tipoia devido à baixa carga no membro."],
                correta: 2,
                comentario: "No adulto, a fratura do antebraço é considerada articular pois interfere na pronação/supinação, exigindo redução anatômica precisa e fixação rígida com placas e parafusos."
            },
            {
                categoria: categorias[2],
                texto: "Qual é a característica principal de uma fratura em 'Galho Verde' típica de pacientes pediátricos?",
                opcoes: ["Fratura completa com grande cominuição óssea.", "Fratura na qual uma cortical quebra e a outra se dobra, mantendo a continuidade.", "Fratura que acomete exclusivamente a cartilagem de crescimento.", "Fratura exposta decorrente de torção extrema."],
                correta: 1,
                comentario: "Em crianças, o periósteo espesso e osso mais poroso permitem a deformação elástica e plástica. A fratura em galho verde tem uma cortical rompida e a oposta deformada."
            },
            {
                categoria: categorias[2],
                texto: "Identifique a fratura-luxação de Galeazzi:",
                opcoes: ["Fratura da ulna proximal associada a luxação posterior do cotovelo.", "Fratura diafisária do rádio distal associada à luxação da articulação radioulnar distal.", "Avulsão do olécrano com deslocamento tricipital.", "Fratura cominutiva do carpo."],
                correta: 1,
                comentario: "Galeazzi envolve a fratura do terço distal do rádio junto com ruptura e luxação da articulação radioulnar distal (ARUD)."
            },
            {
                categoria: categorias[2],
                texto: "Na avaliação de sequelas de fraturas diafisárias do antebraço, a limitação de qual movimento indica má consolidação anatômica (ex: alteração do arco do rádio)?",
                opcoes: ["Flexão e extensão do cotovelo.", "Desvio ulnar e radial isolados.", "Pronação e supinação do antebraço.", "Apenas supinação forçada do punho."],
                correta: 2,
                comentario: "A diáfise do rádio tem uma curvatura natural (arco) essencial para o movimento rotacional em torno da ulna. Sua perda resulta em déficit de pronação e supinação."
            },
            {
        categoria: categorias[2],
        texto: "Sobre fraturas de antebraço assinale a única alternativa VERDADEIRA:",
        opcoes: [
            "O tratamento de escolha da fratura dos ossos do antebraço no adulto é a redução anatómica e fixação interna rígida.",
            "Fraturas dos ossos do antebraço em doentes de 20 anos é melhor tratada com redução fechada e imobilização gessada.",
            "A fratura em Galho Verde é melhor tratada cirurgicamente no adulto e conservadoramente na criança.",
            "A fratura de Monteggia é a fratura do rádio distal com luxação rádio-ulnar distal."
        ],
        correta: 0,
        comentario: "No adulto, as fraturas diafisárias do antebraço devem ser tratadas como fraturas articulares, exigindo redução perfeita e fixação rígida com placas e parafusos para não perder a capacidade de pronossupinação."
    },

            // --- Categoria 4: Fraturas e luxações dos carpos ---
            {
                categoria: categorias[3],
                texto: "O osso escafoide possui uma peculiaridade anatômica que favorece complicações após a sua fratura. Marque a alternativa que descreve esse risco.",
                opcoes: ["A vascularização é retrógrada, predispondo à necrose avascular do polo proximal.", "Possui alta taxa de vascularização colateral, dificultando consolidação rápida.", "É um osso exclusivamente fibroso, tendendo a frouxidão ligamentar.", "Sua proximidade ao nervo ulnar causa rotineiramente neuropatia motora."],
                correta: 0,
                comentario: "A principal artéria nutridora entra pelo polo distal do escafoide. Fraturas no terço médio ou proximal interrompem o sangue para o polo proximal, gerando alto risco de necrose avascular."
            },
            {
                categoria: categorias[3],
                texto: "A doença de Kienböck afeta primariamente qual osso do carpo?",
                opcoes: ["Semilunar, causando osteonecrose.", "Escafoide, induzindo não-união.", "Hamato, com fratura do gancho.", "Pisiforme, gerando dor focal."],
                correta: 0,
                comentario: "A Doença de Kienböck é a necrose avascular idiopática do osso semilunar, comum em adultos jovens, que gera colapso e artrose progressiva do carpo."
            },
            {
                categoria: categorias[3],
                texto: "No trauma de punho com diagnóstico de Luxação Perilunar, qual o padrão de desvio dos ossos na radiografia de perfil?",
                opcoes: ["O semilunar luxa-se volarmente fora de sua fossa radial.", "O semilunar permanece no rádio, e o capitato luxa-se para a região dorsal.", "O rádio luxa-se totalmente para a região palmar.", "Ocorre sobreposição unicamente do escafoide sobre o semilunar."],
                correta: 1,
                comentario: "Na luxação perilunar pura, o semilunar permanece alinhado com o rádio (dentro da fossa da glenoide radial), mas o carpo restante (representado pelo capitato) é deslocado dorsalmente."
            },
            {
                categoria: categorias[3],
                texto: "Ao segurar raquetes, tacos de golfe ou bastões, pacientes podem sofrer fratura por avulsão ou estresse de qual osso do carpo, evoluindo com parestesia ulnar?",
                opcoes: ["Trapezoide.", "Capitato.", "Processo estiloide da ulna.", "Hâmulo (gancho) do hamato."],
                correta: 3,
                comentario: "A fratura do gancho do hamato é típica em esportes de empunhadura. A proximidade com o Canal de Guyon pode causar sintomas de compressão do nervo ulnar."
            },
            {
                categoria: categorias[3],
                texto: "Qual das seguintes afirmações sobre a anatomia cirúrgica e o diagnóstico das fraturas de escafoide é INCORRETA?",
                opcoes: ["O acesso cirúrgico volar de Russe é evitado devido ao risco ao nervo mediano.", "A dor ocorre tipicamente na tabaqueira anatômica.", "A ressonância magnética pode revelar fraturas ocultas no RX normal.", "Gesso antebraquiopalmar incluindo o polegar é uma opção conservadora comum."],
                correta: 0,
                comentario: "O acesso volar de Russe é, na verdade, um dos acessos MAIS indicados para fraturas do terço médio/distal do escafoide, poupando a vascularização dorsal. A alternativa A é a incorreta."
            },
            {
        categoria: categorias[3],
        texto: "Com relação às fraturas dos ossos do carpo, assinale a única alternativa FALSA:",
        opcoes: [

            categorias.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-left p-4 rounded-xl shadow transition font-medium text-gray-800 dark:text-gray-200";
                btn.innerText = cat;
                const qtd = bancoDeQuestoes.filter(q => q.categoria === cat).length;
                btn.innerHTML += `<span class="block text-sm text-gray-500 dark:text-gray-400 font-normal mt-1">${qtd} questões</span>`;
                btn.onclick = () => startQuiz('category', cat);
                catList.appendChild(btn);
            });

            document.getElementById('categoryScreen').classList.remove('hidden');
        }

        // Implementação estrita do algoritmo Fisher-Yates para não haver repetição
        function embaralhar(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                // Swap Elements
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startQuiz(mode, category = null) {
            pontuacao = 0;
            indiceAtual = 0;
            // Reset counters
            categorias.forEach(cat => { desempenhoPorCategoria[cat] = { total: 0, acertos: 0 }; });

            // CRÍTICO PARA O BUG: Criamos um clone raso das questões usando o Map/Spread antes de embaralhar.
            if (mode === 'full') {
                questoesAtuais = embaralhar([...bancoDeQuestoes]);
            } else {
                questoesAtuais = embaralhar(bancoDeQuestoes.filter(q => q.categoria === category));
            }

            if (questoesAtuais.length === 0) {
                alert("Nenhuma questão encontrada para esta seleção.");
                return showHome();
            }

            hideAllScreens();
            document.getElementById('quizScreen').classList.remove('hidden');
            renderizarQuestao();
        }

        let opcaoSelecionada = null;
        let respondido = false;

        function renderizarQuestao() {
            respondido = false;
            opcaoSelecionada = null;
            
            const questao = questoesAtuais[indiceAtual];
            document.getElementById('questionCounter').innerText = `Questão ${indiceAtual + 1} de ${questoesAtuais.length}`;
            document.getElementById('currentCategory').innerText = questao.categoria;
            document.getElementById('questionText').innerText = questao.texto;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            desempenhoPorCategoria[questao.categoria].total++;

            questao.opcoes.forEach((opcao, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn text-left p-4 rounded-xl border-2 border-gray-200 dark:border-gray-600 hover:border-primary dark:hover:border-primary bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full";
                btn.innerHTML = `<div class="flex items-start">
                    <span class="flex-shrink-0 w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center font-bold mr-3 mt-0.5">${String.fromCharCode(65 + index)}</span>
                    <span class="mt-1">${opcao}</span>
                </div>`;
                btn.onclick = () => selecionarOpcao(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('btnConfirm').classList.remove('hidden');
            document.getElementById('btnConfirm').disabled = true;
            document.getElementById('btnNext').classList.add('hidden');
            document.getElementById('feedbackContainer').classList.add('hidden');
        }

        function selecionarOpcao(index, btnElement) {
            if (respondido) return;
            opcaoSelecionada = index;
            const botoes = document.querySelectorAll('.option-btn');
            botoes.forEach(b => {
                b.classList.remove('border-primary', 'bg-blue-50', 'dark:bg-blue-900/30');
                b.classList.add('border-gray-200', 'dark:border-gray-600');
            });
            btnElement.classList.add('border-primary', 'bg-blue-50', 'dark:bg-blue-900/30');
            btnElement.classList.remove('border-gray-200', 'dark:border-gray-600');
            document.getElementById('btnConfirm').disabled = false;
        }

        function confirmAnswer() {
            if (opcaoSelecionada === null || respondido) return;
            respondido = true;

            const questao = questoesAtuais[indiceAtual];
            const botoes = document.querySelectorAll('.option-btn');
            const feedbackContainer = document.getElementById('feedbackContainer');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackText = document.getElementById('feedbackText');

            botoes.forEach(b => b.disabled = true);

            if (opcaoSelecionada === questao.correta) {
                pontuacao++;
                desempenhoPorCategoria[questao.categoria].acertos++;
                botoes[opcaoSelecionada].classList.add('border-success', 'bg-green-50', 'dark:bg-green-900/30', 'text-green-800', 'dark:text-green-200');
                botoes[opcaoSelecionada].classList.remove('border-primary', 'bg-blue-50');
                
                feedbackContainer.classList.replace('border-l-4', 'border-success');
                feedbackContainer.className = "bg-green-50 dark:bg-green-900/20 p-4 rounded-xl border-l-4 border-success mb-6 fade-in";
                feedbackTitle.innerText = "Correto!";
                feedbackTitle.className = "font-bold mb-2 text-success";
            } else {
                botoes[opcaoSelecionada].classList.add('border-danger', 'bg-red-50', 'dark:bg-red-900/30', 'text-red-800', 'dark:text-red-200');
                botoes[questao.correta].classList.add('border-success', 'bg-green-50', 'dark:bg-green-900/30', 'text-green-800', 'dark:text-green-200'); 
                
                feedbackContainer.className = "bg-red-50 dark:bg-red-900/20 p-4 rounded-xl border-l-4 border-danger mb-6 fade-in";
                feedbackTitle.innerText = "Incorreto";
                feedbackTitle.className = "font-bold mb-2 text-danger";
            }

            feedbackText.innerText = questao.comentario;
            feedbackContainer.classList.remove('hidden');
            document.getElementById('btnConfirm').classList.add('hidden');
            
            const btnNext = document.getElementById('btnNext');
            btnNext.classList.remove('hidden');
            if (indiceAtual === questoesAtuais.length - 1) {
                btnNext.innerText = "Ver Resultados";
                btnNext.classList.replace('bg-secondary', 'bg-primary');
                btnNext.classList.replace('hover:bg-gray-600', 'hover:bg-blue-700');
            } else {
                btnNext.innerText = "Próxima";
            }
        }

        function nextQuestion() {
            indiceAtual++;
            if (indiceAtual < questoesAtuais.length) {
                renderizarQuestao();
            } else {
                mostrarResultados();
            }
        }

        function mostrarResultados() {
            hideAllScreens();
            document.getElementById('resultScreen').classList.remove('hidden');
            
            const percGeral = Math.round((pontuacao / questoesAtuais.length) * 100);
            const corNota = percGeral >= 70 ? 'text-success' : (percGeral >= 50 ? 'text-yellow-500' : 'text-danger');
            
            const finalScore = document.getElementById('finalScore');
            finalScore.innerText = `${percGeral}%`;
            finalScore.className = `text-6xl font-black mb-2 ${corNota}`;
            
            const breakdown = document.getElementById('performanceBreakdown');
            breakdown.innerHTML = '';
            const weakPointsList = document.getElementById('weakPointsList');
            weakPointsList.innerHTML = '';
            let hasWeakPoints = false;

            for (const cat in desempenhoPorCategoria) {
                const dados = desempenhoPorCategoria[cat];
                if (dados.total > 0) {
                    const percCat = Math.round((dados.acertos / dados.total) * 100);
                    const corBarra = percCat >= 70 ? 'bg-success' : (percCat >= 60 ? 'bg-yellow-400' : 'bg-danger');
                    
                    breakdown.innerHTML += `
                        <div class="mb-2">
                            <div class="flex justify-between text-sm mb-1 text-gray-700 dark:text-gray-300">
                                <span>${cat}</span>
                                <span>${percCat}% (${dados.acertos}/${dados.total})</span>
                            </div>
                            <div class="w-full bg-gray-200 dark:bg-gray-600 rounded-full h-2.5">
                                <div class="${corBarra} h-2.5 rounded-full" style="width: ${percCat}%"></div>
                            </div>
                        </div>
                    `;
                    if (percCat < 60) {
                        hasWeakPoints = true;
                        weakPointsList.innerHTML += `<li>${cat} - Desempenho de ${percCat}%. (Recomendada revisão do tema).</li>`;
                    }
                }
            }

            const weakContainer = document.getElementById('weakPointsContainer');
            if (hasWeakPoints) { weakContainer.classList.remove('hidden'); } 
            else { weakContainer.classList.add('hidden'); }
        }

        showHome();
    </script>
</body>
</html>
